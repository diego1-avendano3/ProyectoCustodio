name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  policies:
    name: Políticas Rego (Custodia PDP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: opa test
        run: opa test policies/ -v

  java:
    name: Build & test (Java 21 / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        run: mvn -B verify

  # Fase 4 añade aquí: SAST (Semgrep/SonarQube), SCA (Dependabot ya cubre
  # esto vía PRs automáticos) y las pruebas de abuso de la especificación.
